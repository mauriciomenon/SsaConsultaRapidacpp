name: Snyk Code

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  schedule:
    - cron: "42 9 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snyk-code:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      TRUSTED_EVENT: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Report disabled scan
        if: env.TRUSTED_EVENT != 'true' || env.SNYK_TOKEN == ''
        run: |
          if [[ "${TRUSTED_EVENT}" != "true" ]]; then
            echo "::notice::Snyk Code is disabled for pull requests from forks."
          else
            echo "::notice::Snyk Code is disabled because SNYK_TOKEN is not configured."
          fi
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        if: env.TRUSTED_EVENT == 'true' && env.SNYK_TOKEN != ''
        with:
          persist-credentials: false
      - name: Set up Snyk CLI
        if: env.TRUSTED_EVENT == 'true' && env.SNYK_TOKEN != ''
        uses: snyk/actions/setup@806182742461562b67788a64410098c9d9b96adb
      - name: Run Snyk Code
        id: snyk-code
        if: env.TRUSTED_EVENT == 'true' && env.SNYK_TOKEN != ''
        continue-on-error: true
        run: snyk code test --sarif-file-output=snyk-code.sarif
      - name: Upload Snyk Code SARIF
        if: always() && env.TRUSTED_EVENT == 'true' && env.SNYK_TOKEN != '' && hashFiles('snyk-code.sarif') != ''
        uses: github/codeql-action/upload-sarif@b0c4fd77f6c559021d78430ec4d0d169ae74a4eb
        with:
          sarif_file: snyk-code.sarif
          category: snyk-code
      - name: Enforce Snyk Code result
        if: env.TRUSTED_EVENT == 'true' && env.SNYK_TOKEN != '' && steps.snyk-code.outcome == 'failure'
        run: |
          echo "Snyk Code reported findings or a scan failure." >&2
          exit 1
