name: secrets

# Gitleaks gates the current tree quickly in ci.yml. This workflow adds
# full Git history coverage and a filesystem scan of the exact tracked tree.

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  schedule:
    - cron: "35 8 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan full Git history with TruffleHog
        uses: trufflesecurity/trufflehog@27b0417c16317ca9a472a9a8092acce143b49c55
        with:
          base: ""
          head: ${{ github.sha }}
          version: "3.95.9@sha256:59b244249d1a1aef4baa24fe73d3c931616264482580d806d77f6c74d26b3e42"
          extra_args: --results=verified,unknown --fail-on-scan-errors
      - name: Scan tracked filesystem with TruffleHog
        run: |
          set -euo pipefail
          tracked_root="${RUNNER_TEMP}/tracked-tree"
          mkdir -p "${tracked_root}"
          git archive --format=tar HEAD | tar -xf - -C "${tracked_root}"
          docker run --rm \
            --volume "${tracked_root}:/src:ro" \
            ghcr.io/trufflesecurity/trufflehog:3.95.9@sha256:59b244249d1a1aef4baa24fe73d3c931616264482580d806d77f6c74d26b3e42 \
            filesystem /src \
            --results=verified,unknown \
            --fail \
            --fail-on-scan-errors \
            --no-update \
            --github-actions
