name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  QT_VERSION: "6.11.0"

jobs:
  macos:
    # macos-15 defaults to Xcode 16.4, whose libc++ still hides std::jthread/std::stop_token
    # behind -fexperimental-library; Xcode 26 (default on macos-26) ships them.
    runs-on: macos-26
    timeout-minutes: 90
    env:
      # binaryDir of the dev preset: build/${hostSystemName}/native/dev.
      BUILD_DIR: build/Darwin/native/dev
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: ${{ env.QT_VERSION }}
          arch: clang_64
          cache: true
      - name: Toolchain
        run: xcodebuild -version && c++ --version
      - name: Install dependencies
        run: brew install cmake ninja sqlite llvm clazy gitleaks
      # reviewdog left homebrew-core; the official setup action installs a pinned release.
      - uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f
        with:
          reviewdog_version: v0.21.2
      - name: Configure
        run: cmake --preset dev -DCMAKE_PREFIX_PATH="$(qtpaths --query QT_INSTALL_PREFIX)"
      - name: Build
        run: cmake --build --preset dev
      - name: Test
        run: ctest --preset dev --output-on-failure
      - name: QML lint
        run: cmake --build --preset dev --target all_qmllint
      - name: C++ format
        run: find src app tests tools -type f \( -name '*.cpp' -o -name '*.h' \) -print0 | xargs -0 "$(brew --prefix llvm)/bin/clang-format" --dry-run --Werror
      - name: C++ tidy
        run: |
          SDKROOT="$(xcrun --show-sdk-path)"
          PATH="$(brew --prefix llvm)/bin:$PATH" run-clang-tidy -p "$BUILD_DIR" -quiet \
            -header-filter="$PWD/(src|app|tools)/.*" \
            -extra-arg=-isysroot -extra-arg="$SDKROOT" \
            "$PWD/(src|app|tools)/.*\\.(cpp|h)$"
      - name: Qt static analysis on changed lines
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          sdk="$(xcrun --sdk macosx --show-sdk-path)"
          resource="$("$(brew --prefix llvm)/bin/clang" -print-resource-dir)"
          # Only translation units the dev build compiles (optional Arrow tools are not in it).
          python3 -I -c 'import json, os, sys
          root = os.getcwd() + "/"
          files = {e["file"] for e in json.load(open(sys.argv[1] + "/compile_commands.json"))}
          print("\0".join(sorted(f for f in files if f.startswith(tuple(root + d + "/" for d in ("src", "app", "tools"))))), end="")' "$BUILD_DIR" | xargs -0 \
            clazy-standalone -p "$BUILD_DIR" -checks=level0,level1 --only-qt \
            --header-filter="$PWD/(src|app|tools)/.*" \
            --ignore-dirs='/(build|_deps)/' \
            --extra-arg="-resource-dir=$resource" \
            --extra-arg=-isysroot --extra-arg="$sdk" \
            --extra-arg=-isystem --extra-arg="$sdk/usr/include/c++/v1" \
            2>&1 | tee "$BUILD_DIR/clazy.log"
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            diff_command="git diff --no-ext-diff ${PR_BASE_SHA} ${PR_HEAD_SHA}"
          elif [[ "${PUSH_BEFORE_SHA}" == "0000000000000000000000000000000000000000" ]]; then
            diff_command="git show --format= --no-ext-diff ${GITHUB_SHA}"
          else
            diff_command="git diff --no-ext-diff ${PUSH_BEFORE_SHA} ${GITHUB_SHA}"
          fi
          # The GitHub annotation reporters need an API token and, outside a pull request,
          # drop the added-lines filter; the local reporter filters by this diff without one.
          reviewdog \
            -efm='%f:%l:%c: %t%*[^:]: %m' \
            -name=clazy \
            -reporter=local \
            -filter-mode=added \
            -diff="${diff_command}" \
            -fail-level=warning \
            < "$BUILD_DIR/clazy.log"
      - name: Secret scan
        run: gitleaks dir . --redact --exit-code 1 --no-banner
      - name: Package macOS bundle (release + macdeployqt)
        run: |
          CMAKE_PREFIX_PATH="$(qtpaths --query QT_INSTALL_PREFIX)"
          PATH="${CMAKE_PREFIX_PATH}/bin:$PATH"
          export CMAKE_PREFIX_PATH
          export PATH
          ./scripts/package-macos.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ssa-consulta-rapida-macos
          path: dist/macos/arm64/ssa_consulta_rapida-*-arm64-macos.zip
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
      BUILD_DIR: build/Linux/native/dev
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libsqlite3-dev libgl1-mesa-dev sqlite3
      - name: Configure
        run: cmake --preset dev
      - name: Build
        run: cmake --build --preset dev
      - name: Test
        run: ctest --preset dev --output-on-failure
      - name: QML lint
        run: cmake --build --preset dev --target all_qmllint
      - name: Memory regression smoke
        run: |
          set -euo pipefail
          trap 'rm -f /tmp/mem_fixture.db' EXIT
          sqlite3 /tmp/mem_fixture.db < tools/generate_mem_fixture.sql
          "$BUILD_DIR/ssa_mem_stress" \
            --db /tmp/mem_fixture.db \
            --pages 120 \
            --page-size 50 \
            --warmup-pages 40 \
            --max-footprint-delta-kb 2048

  windows:
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      # Clazy is intentionally centralized in the macOS job. The Windows job
      # remains the MSVC compile/runtime contract for platform-specific code.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Set up Developer PowerShell for VS 2022
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true
          # aqtinstall 3.3.0 (latest on PyPI) cannot read the per-toolchain Windows layout
          # of Qt 6.11; this is the merge of miurahr/aqtinstall#1000 that adds it.
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b
      - name: Cache vcpkg
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            C:\Users\runneradmin\.cache\vcpkg
            C:\vcpkg\installed
          key: ${{ runner.os }}-vcpkg-sqlite3-x64-windows
          restore-keys: |
            ${{ runner.os }}-vcpkg-
      - name: Install SQLite via vcpkg
        run: vcpkg install sqlite3:x64-windows
      - name: Configure
        run: |
          cmake --preset dev `
            -DCMAKE_PREFIX_PATH="$env:Qt6_DIR" `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
      - name: Build
        run: cmake --build --preset dev
      - name: QML lint
        run: cmake --build --preset dev --target all_qmllint
      - name: Test
        run: ctest --preset dev --output-on-failure
      # Failed QML tests on this runner image printed nothing through ctest. Rerun each one
      # with a QtTest file log and show the Windows exit code (for example 0xC0000005).
      - name: Diagnose failed tests
        if: failure()
        env:
          QT_QUICK_CONTROLS_STYLE: Basic
          QT_SCALE_FACTOR: "1"
        run: |
          $buildDir = "build/Windows/native/dev"
          $env:QT_QPA_FONTDIR = Join-Path $env:WINDIR "Fonts"
          $failedList = Join-Path $buildDir "Testing/Temporary/LastTestsFailed.log"
          if (-not (Test-Path -LiteralPath $failedList)) { exit 0 }
          foreach ($line in Get-Content -LiteralPath $failedList) {
            $name = ($line -split ':', 2)[1]
            $exe = Join-Path $buildDir "$name.exe"
            if (-not (Test-Path -LiteralPath $exe)) { "{0}: no executable of that name (Catch2 case), see the ctest log" -f $name; continue }
            $log = Join-Path $buildDir "$name.diagnose.txt"
            # Bounded above the largest ctest TIMEOUT (180 s): a hang must still leave time to print the partial log.
            $process = Start-Process -FilePath $exe -ArgumentList @("-o", "$log,txt") -NoNewWindow -PassThru
            $null = $process.Handle
            if ($process.WaitForExit(200000)) {
              "{0} exit=0x{1:X8}" -f $name, $process.ExitCode
            } else {
              $process.Kill($true)
              "{0} still running after 200 s, killed" -f $name
            }
            if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log -Tail 120 }
          }
