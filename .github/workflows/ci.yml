name: ci

on:
  push:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install qt cmake ninja sqlite llvm gitleaks
      - name: Configure
        run: cmake --preset dev -DCMAKE_PREFIX_PATH="$(brew --prefix qt)"
      - name: Build
        run: cmake --build --preset dev
      - name: Test
        run: ctest --preset dev --output-on-failure
      - name: QML lint
        run: qmllint -I build/dev app/desktop/qml/Main.qml app/desktop/qml/Theme.qml app/desktop/qml/components/*.qml
      - name: C++ format
        run: find src app tests -type f \( -name '*.cpp' -o -name '*.h' \) -print0 | xargs -0 "$(brew --prefix llvm)/bin/clang-format" --dry-run --Werror
      - name: C++ tidy
        run: |
          SDKROOT="$(xcrun --show-sdk-path)"
          PATH="$(brew --prefix llvm)/bin:$PATH" run-clang-tidy -p build/dev -quiet \
            -header-filter="$PWD/(src|app)/.*" \
            -extra-arg=-isysroot -extra-arg="$SDKROOT" \
            "$PWD/(src|app)/.*\\.(cpp|h)$"
      - name: Secret scan
        run: gitleaks dir . --redact --exit-code 1 --no-banner
      - name: Package macOS bundle
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            build/dev/ssa_consulta_rapida.app \
            dist/ssa_consulta_rapida-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ssa-consulta-rapida-macos
          path: dist/ssa_consulta_rapida-macos.zip

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          cache: true
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libsqlite3-dev libgl1-mesa-dev
      - name: Configure
        run: cmake --preset dev
      - name: Build
        run: cmake --build --preset dev
      - name: Test
        run: ctest --preset dev --output-on-failure
      - name: QML lint
        run: qmllint -I build/dev app/desktop/qml/Main.qml app/desktop/qml/Theme.qml app/desktop/qml/components/*.qml
