name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: brew install qt cmake ninja sqlite llvm clazy reviewdog gitleaks
      - name: Configure
        run: cmake --preset dev -DCMAKE_PREFIX_PATH="$(brew --prefix qt)"
      - name: Build
        run: cmake --build --preset dev
      - name: Test
        run: ctest --preset dev --output-on-failure
      - name: QML lint
        run: cmake --build --preset dev --target all_qmllint
      - name: C++ format
        run: find src app tests tools -type f \( -name '*.cpp' -o -name '*.h' \) -print0 | xargs -0 "$(brew --prefix llvm)/bin/clang-format" --dry-run --Werror
      - name: C++ tidy
        run: |
          SDKROOT="$(xcrun --show-sdk-path)"
          PATH="$(brew --prefix llvm)/bin:$PATH" run-clang-tidy -p build/dev -quiet \
            -header-filter="$PWD/(src|app|tools)/.*" \
            -extra-arg=-isysroot -extra-arg="$SDKROOT" \
            "$PWD/(src|app|tools)/.*\\.(cpp|h)$"
      - name: Qt static analysis on changed lines
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          sdk="$(xcrun --sdk macosx --show-sdk-path)"
          resource="$("$(brew --prefix llvm)/bin/clang" -print-resource-dir)"
          find src app tools -type f -name '*.cpp' -print0 | xargs -0 \
            clazy-standalone -p build/dev -checks=level0,level1 --only-qt \
            --header-filter="$PWD/(src|app|tools)/.*" \
            --ignore-dirs='/(build|_deps)/' \
            --extra-arg="-resource-dir=$resource" \
            --extra-arg=-isysroot --extra-arg="$sdk" \
            --extra-arg=-isystem --extra-arg="$sdk/usr/include/c++/v1" \
            2>&1 | tee build/dev/clazy.log
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            reporter="github-pr-annotations"
            diff_command="git diff --no-ext-diff ${PR_BASE_SHA} ${PR_HEAD_SHA}"
          else
            reporter="github-annotations"
            if [[ "${PUSH_BEFORE_SHA}" == "0000000000000000000000000000000000000000" ]]; then
              diff_command="git show --format= --no-ext-diff ${GITHUB_SHA}"
            else
              diff_command="git diff --no-ext-diff ${PUSH_BEFORE_SHA} ${GITHUB_SHA}"
            fi
          fi
          reviewdog \
            -efm='%f:%l:%c: %t%*[^:]: %m' \
            -name=clazy \
            -reporter="${reporter}" \
            -filter-mode=added \
            -diff="${diff_command}" \
            -fail-level=warning \
            < build/dev/clazy.log
      - name: Secret scan
        run: gitleaks dir . --redact --exit-code 1 --no-banner
      - name: Package macOS bundle (release + macdeployqt)
        run: |
          CMAKE_PREFIX_PATH="$(brew --prefix qt)"
          PATH="$(brew --prefix qt)/bin:$PATH"
          export CMAKE_PREFIX_PATH
          export PATH
          ./scripts/package-macos.sh --skip-tests
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ssa-consulta-rapida-macos
          path: dist/macos/arm64/ssa_consulta_rapida-*-arm64-macos.zip

  linux:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: "6.11.0"
          cache: true
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libsqlite3-dev libgl1-mesa-dev sqlite3
      - name: Configure
        run: cmake --preset dev
      - name: Build
        run: cmake --build --preset dev
      - name: Test
        run: ctest --preset dev --output-on-failure
      - name: QML lint
        run: cmake --build --preset dev --target all_qmllint
      - name: Memory regression smoke
        run: |
          set -e
          trap 'rm -f /tmp/mem_fixture.db mem_smoke.tsv' EXIT
          sqlite3 /tmp/mem_fixture.db < tools/generate_mem_fixture.sql
          ./build/dev/ssa_mem_stress --db /tmp/mem_fixture.db --pages 40 --page-size 50 > mem_smoke.tsv
          awk -F'\t' '
            NR==2 {
              if (NF < 3 || $3 !~ /^[0-9]+$/) { print "FAIL: invalid memory column format at row 2"; exit 1 }
              start=$3
            }
            END {
              if (NR < 2 || NF < 3 || $3 !~ /^[0-9]+$/) { print "FAIL: missing or invalid data rows"; exit 1 }
              delta=$3-start
              printf "startup=%dKB final=%dKB delta=%dKB\n", start, $3, delta
              if (delta > 2048) { print "FAIL: delta exceeds 2MB budget"; exit 1 }
              print "PASS: delta within 2MB budget"
            }
          ' mem_smoke.tsv

  windows:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      # Clazy is intentionally centralized in the macOS job. The Windows job
      # remains the MSVC compile/runtime contract for platform-specific code.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Set up Developer PowerShell for VS 2022
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: "6.11.0"
          arch: win64_msvc2022_64
          cache: true
      - name: Cache vcpkg
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            C:\Users\runneradmin\.cache\vcpkg
            C:\vcpkg\installed
          key: ${{ runner.os }}-vcpkg-sqlite3-x64-windows
          restore-keys: |
            ${{ runner.os }}-vcpkg-
      - name: Install SQLite via vcpkg
        run: vcpkg install sqlite3:x64-windows
      - name: Configure
        run: |
          cmake --preset dev `
            -DCMAKE_PREFIX_PATH="$env:Qt6_DIR" `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
      - name: Build
        run: cmake --build --preset dev
      - name: QML lint
        run: cmake --build --preset dev --target all_qmllint
      - name: Test
        run: ctest --preset dev --output-on-failure
