name: semgrep

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  schedule:
    - cron: '18 15 * * 5'

permissions:
  contents: read

jobs:
  semgrep:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    name: Scan C, C++, and QML policies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Test project QML policies
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            semgrep/semgrep:1.169.0@sha256:2b33f46ba66cf8cc2ad59ccfa7d22951fd00c632c38f1339e84ec8e6e641a942 \
            semgrep test .semgrep
      - name: Run Semgrep CE
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            semgrep/semgrep:1.169.0@sha256:2b33f46ba66cf8cc2ad59ccfa7d22951fd00c632c38f1339e84ec8e6e641a942 \
            semgrep scan \
            --config p/c \
            --config p/security-audit \
            --config .semgrep/qml.yml \
            --error \
            --metrics=off \
            --sarif-output=/src/semgrep.sarif \
            src app tests tools
      - name: Upload SARIF file
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@b0c4fd77f6c559021d78430ec4d0d169ae74a4eb
        with:
          sarif_file: semgrep.sarif
