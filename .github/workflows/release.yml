name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versao a empacotar (deixa vazio para ler do CMakeLists.txt)"
        required: false
        default: ""

jobs:
  # ---------------------------------------------------------------
  # macOS: arm64 e amd64. Entregavel: .dmg + .zip com .app bundle.
  # ---------------------------------------------------------------
  macos:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install Qt + deps
        run: brew install qt cmake ninja sqlite gitleaks
      - name: Package macOS (.app/.dmg/.zip)
        run: |
          qt_prefix="$(brew --prefix qt)"
          export CMAKE_PREFIX_PATH="${qt_prefix}"
          export PATH="${qt_prefix}/bin:$PATH"
          ./scripts/package-macos.sh --skip-tests
      - name: Normalize arch folder to arm64/amd64
        run: |
          src="dist/macos/${{ matrix.arch }}"
          dst="dist/macos/${{ matrix.arch == 'x86_64' && 'amd64' || 'arm64' }}"
          if [[ "${src}" != "${dst}" && -d "${src}" ]]; then
            mkdir -p "$(dirname "${dst}")"
            rm -rf "${dst}"
            mv "${src}" "${dst}"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-macos-${{ matrix.arch == 'x86_64' && 'amd64' || 'arm64' }}
          path: |
            dist/macos/**/*.dmg
            dist/macos/**/*.zip

  # ---------------------------------------------------------------
  # Windows: amd64 (x64 host) e arm64 (windows-11-arm runner).
  # Entregavel: .zip portatil + .exe (NSIS).
  # ---------------------------------------------------------------
  windows:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: amd64
            runner: windows-latest
            msvc_arch: x64
            vcpkg_triplet: x64-windows
            qt_arch: win64_msvc2022_64
          - artifact: arm64
            runner: windows-11-arm
            msvc_arch: arm64
            vcpkg_triplet: arm64-windows
            qt_arch: win64_msvc2022_arm64
    runs-on: ${{ matrix.runner }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Set up Developer PowerShell for VS 2022
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: ${{ matrix.msvc_arch }}
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: "6.11.0"
          arch: ${{ matrix.qt_arch }}
          cache: true
      - name: Cache vcpkg
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            C:\Users\runneradmin\.cache\vcpkg
            C:\vcpkg\installed
          key: ${{ runner.os }}-${{ matrix.artifact }}-vcpkg-sqlite3
      - name: Install SQLite via vcpkg
        run: vcpkg install sqlite3:${{ matrix.vcpkg_triplet }}
      - name: Package Windows (.zip/.exe)
        shell: pwsh
        run: |
          .\scripts\package-windows.ps1 -SkipTests -Arch ${{ matrix.artifact }} `
            -CmakeExtraArgs "-DCMAKE_PREFIX_PATH=$env:Qt6_DIR" `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            "-DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_triplet }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-windows-${{ matrix.artifact }}
          path: |
            dist/windows/**/*.zip
            dist/windows/**/*-installer.exe

  # ---------------------------------------------------------------
  # Debian/Ubuntu: amd64 e arm64. Entregavel: .deb
  # ---------------------------------------------------------------
  debian:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: "6.11.0"
          cache: true
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libsqlite3-dev libgl1-mesa-dev \
            sqlite3 dpkg-dev fakeroot
      - name: Package Debian (.deb)
        run: |
          export CMAKE_PREFIX_PATH="${Qt6_DIR}"
          ./scripts/package-debian.sh --skip-tests --arch "${{ matrix.arch }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-debian-${{ matrix.arch }}
          path: dist/linux/${{ matrix.arch }}/*.deb

  # ---------------------------------------------------------------
  # Arch/Artix: amd64 e arm64. Entregavel: .pkg.tar.zst
  # makepkg recusa root, por isso rodamos via usuario builder.
  # ---------------------------------------------------------------
  arch:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    container: archlinux@sha256:d9abf957599bddf27955a0dd82b4457dcfaace50525bb773f6c7518f8015e7e4
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install deps + builder user (Arch)
        run: |
          # Init keyring + atualiza antes de instalar pacotes.
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm --needed archlinux-keyring
          pacman -S --noconfirm --needed base-devel cmake ninja \
            qt6-base qt6-declarative qt6-tools qt6-shadertools sqlite zstd
          # makepkg se recusa a rodar como root.
          id builder >/dev/null 2>&1 || useradd -m -G wheel -s /bin/bash builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
          chown -R builder:builder "${GITHUB_WORKSPACE:-$(pwd)}"
      - name: Package Arch (.pkg.tar.zst)
        run: |
          su builder -c "./scripts/package-arch.sh --skip-tests --arch '${{ matrix.arch }}'"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-arch-${{ matrix.arch }}
          path: dist/linux/${{ matrix.arch }}/*.pkg.tar.zst

  # ---------------------------------------------------------------
  # Release: reune todos os artifacts e publica no GitHub Release.
  # ---------------------------------------------------------------
  publish:
    needs: [macos, windows, debian, arch]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Read version + tag
        id: ver
        run: |
          v="${{ github.event.inputs.version }}"
          if [[ -z "${v}" ]]; then
            v="$(sed -nE 's/^[[:space:]]*project\(SSAConsultaRapidaCpp[[:space:]]+VERSION[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+).*$/\1/p' CMakeLists.txt | head -n1)"
          fi
          echo "version=${v}" >> "$GITHUB_OUTPUT"
          # Em push de tag, usa o nome da tag pushed; senao deriva da versao.
          ref_name="${GITHUB_REF_NAME-}"
          if [[ "${ref_name}" == v* ]]; then
            echo "tag=${ref_name}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${v}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: release-assets
          merge-multiple: true
      - name: Collect release files
        run: |
          mkdir -p staging
          find release-assets -type f \( \
            -name '*.dmg' -o -name '*.zip' -o -name '*.deb' -o \
            -name '*.pkg.tar.zst' -o -name '*-installer.exe' \) \
            -exec cp {} staging/ \;
          ls -la staging/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: SSA Consulta Rapida ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: staging/*
