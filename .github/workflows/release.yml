name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versao da tag existente a publicar (exemplo: 1.2.3)"
        required: true

permissions:
  contents: read

env:
  QT_VERSION: "6.11.0"

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      ref: ${{ steps.release.outputs.ref }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve and validate release tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${INPUT_VERSION}" == v* ]]; then
              tag="${INPUT_VERSION}"
            else
              tag="v${INPUT_VERSION}"
            fi
          else
            tag="${REF_NAME}"
          fi

          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must match vX.Y.Z" >&2
            exit 1
          fi
          if ! git show-ref --verify --quiet "refs/tags/${tag}"; then
            echo "release tag does not exist: ${tag}" >&2
            exit 1
          fi
          if ! git rev-parse --verify "${tag}^{commit}" >/dev/null; then
            echo "release tag does not point to a commit: ${tag}" >&2
            exit 1
          fi

          version="${tag#v}"
          cmake_version="$(python3 - "${tag}" <<'PY'
          import re
          import subprocess
          import sys

          tag = sys.argv[1]
          source = subprocess.run(
              ["git", "show", f"{tag}:CMakeLists.txt"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout
          project = re.search(
              r"project\s*\(\s*SSAConsultaRapidaCpp\b(?P<body>.*?)\)",
              source,
              flags=re.IGNORECASE | re.DOTALL,
          )
          version = None if project is None else re.search(
              r"\bVERSION\s+([0-9]+\.[0-9]+\.[0-9]+)\b",
              project.group("body"),
              flags=re.IGNORECASE,
          )
          if version is None:
              print("could not read project version from CMakeLists.txt", file=sys.stderr)
              raise SystemExit(1)
          print(version.group(1))
          PY
          )"
          if [[ "${cmake_version}" != "${version}" ]]; then
            echo "tag ${tag} does not match CMake project version ${cmake_version}" >&2
            exit 1
          fi

          {
            echo "ref=refs/tags/${tag}"
            echo "tag=${tag}"
            echo "version=${version}"
          } >> "${GITHUB_OUTPUT}"


  macos:
    needs: resolve
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # std::stop_token needs Xcode 26 or newer (the macos-15 default is Xcode 16).
          - runner: macos-26
            arch: arm64
            artifact: arm64
          - runner: macos-15-intel
            arch: x86_64
            artifact: amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          persist-credentials: false
      - name: Select the newest Xcode and check C++20 stop_token
        run: |
          set -euo pipefail
          xcode="$(find /Applications -maxdepth 1 -name 'Xcode_*.app' | sort -V | tail -n 1)"
          sudo xcode-select -s "${xcode}"
          printf '#include <stop_token>\nint main() { std::stop_source s; return s.stop_requested(); }\n' > "${RUNNER_TEMP}/stop_token.cpp"
          if ! c++ -std=c++20 "${RUNNER_TEMP}/stop_token.cpp" -o "${RUNNER_TEMP}/stop_token"; then
            echo "${xcode}: std::stop_token is unavailable; the project needs Xcode 26 or newer" >&2
            exit 1
          fi
          xcodebuild -version
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: ${{ env.QT_VERSION }}
          arch: clang_64
          cache: true
      - name: Install dependencies
        run: brew install cmake ninja sqlite gitleaks
      - name: Package macOS (.app/.dmg/.zip)
        env:
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          qt_prefix="$(qtpaths --query QT_INSTALL_PREFIX)"
          export CMAKE_PREFIX_PATH="${qt_prefix}"
          export PATH="${qt_prefix}/bin:${PATH}"
          ./scripts/package-macos.sh --version "${RELEASE_VERSION}" --arch "${{ matrix.arch }}"
      - name: Validate macOS artifacts
        env:
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          for extension in dmg zip; do
            count="$(find "dist/macos/${{ matrix.arch }}" -maxdepth 1 -type f \
              -name "*-macos-${{ matrix.arch }}-${RELEASE_VERSION}.${extension}" | wc -l | tr -d ' ')"
            test "${count}" -eq 1
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-macos-${{ matrix.artifact }}
          path: |
            dist/macos/${{ matrix.arch }}/*-macos-${{ matrix.arch }}-${{ needs.resolve.outputs.version }}.dmg
            dist/macos/${{ matrix.arch }}/*-macos-${{ matrix.arch }}-${{ needs.resolve.outputs.version }}.zip
          if-no-files-found: error

  windows:
    needs: resolve
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: amd64
            runner: windows-latest
            msvc_arch: x64
            vcpkg_triplet: x64-windows
            qt_arch: win64_msvc2022_64
          - artifact: arm64
            runner: windows-11-arm
            msvc_arch: arm64
            vcpkg_triplet: arm64-windows
            qt_arch: win64_msvc2022_arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          persist-credentials: false
      - name: Set up Developer PowerShell for VS 2022
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: ${{ matrix.msvc_arch }}
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.qt_arch }}
          cache: true
          # Same pin as ci.yml: aqtinstall 3.3.0 cannot read the per-toolchain Windows
          # layout of Qt 6.11 (it fails with "Failed to locate XML data").
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b
      - name: Cache vcpkg
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            C:\Users\runneradmin\.cache\vcpkg
            C:\vcpkg\installed
          key: ${{ runner.os }}-${{ matrix.artifact }}-vcpkg-sqlite3
      - name: Install package dependencies
        shell: pwsh
        run: |
          vcpkg install sqlite3:${{ matrix.vcpkg_triplet }}
          choco upgrade nsis --version=3.12.0 --yes --no-progress
      - name: Package Windows (.zip/.exe)
        shell: pwsh
        run: |
          # The native host guard only accepts the canonical clone path, so package there
          # and bring dist/ back to the workspace for validation and upload.
          $repo = Join-Path $env:USERPROFILE "gitlab\ssa_consulta_rapida_cpp"
          New-Item -ItemType Directory -Force -Path (Split-Path $repo) | Out-Null
          robocopy $env:GITHUB_WORKSPACE $repo /E /NFL /NDL /NJH /NJS /NP
          if ($LASTEXITCODE -ge 8) { throw "robocopy to $repo failed: $LASTEXITCODE" }
          Set-Location $repo
          $env:SQLite3_ROOT = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed\${{ matrix.vcpkg_triplet }}"
          $cmakeArgs = @(
            "-DCMAKE_PREFIX_PATH=$env:Qt6_DIR",
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake",
            "-DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_triplet }}"
          )
          $global:LASTEXITCODE = 0
          .\scripts\package-windows.ps1 -Arch ${{ matrix.artifact }} `
            -Version "${{ needs.resolve.outputs.version }}" `
            -CmakeExtraArgs $cmakeArgs
          if ($LASTEXITCODE -ne 0) { throw "package-windows.ps1 failed: $LASTEXITCODE" }
          robocopy (Join-Path $repo "dist") (Join-Path $env:GITHUB_WORKSPACE "dist") /E /NFL /NDL /NJH /NJS /NP
          if ($LASTEXITCODE -ge 8) { throw "robocopy of dist failed: $LASTEXITCODE" }
          exit 0
      - name: Validate Windows artifacts
        shell: pwsh
        run: |
          $final = @(Get-ChildItem -Path "dist/windows/${{ matrix.artifact }}" -Directory -Recurse -Filter final)
          if ($final.Count -ne 1) { throw "expected one final folder, found $($final.Count)" }
          $zip = @(Get-ChildItem -Path $final[0].FullName -File -Filter "*-windows-${{ matrix.artifact }}-*.zip")
          $installer = @(Get-ChildItem -Path $final[0].FullName -File -Filter "*-windows-${{ matrix.artifact }}-*-installer.exe")
          if ($zip.Count -ne 1 -or $installer.Count -ne 1 -or
              -not (Test-Path -LiteralPath (Join-Path $final[0].FullName "SHA256SUMS"))) {
            throw "Windows final release set is incomplete"
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-windows-${{ matrix.artifact }}
          path: |
            dist/windows/${{ matrix.artifact }}/*/final/*-windows-${{ matrix.artifact }}-*.zip
            dist/windows/${{ matrix.artifact }}/*/final/*-windows-${{ matrix.artifact }}-*-installer.exe
          if-no-files-found: error

  debian:
    needs: resolve
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          persist-credentials: false
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libsqlite3-dev libgl1-mesa-dev \
            sqlite3 dpkg-dev fakeroot zip
      - name: Package Debian (.deb)
        run: |
          # configure-dev.sh only accepts an explicit Qt prefix through QT_DIR.
          export QT_DIR="${QT_ROOT_DIR}"
          export CMAKE_PREFIX_PATH="${QT_ROOT_DIR}"
          ./scripts/package-debian.sh \
            --version "${{ needs.resolve.outputs.version }}" \
            --arch "${{ matrix.arch }}"
      - name: Validate Debian artifact
        run: |
          set -euo pipefail
          count="$(find "dist/linux/${{ matrix.arch }}" -path '*/final/*' -type f \
            -name "*-debian-${{ matrix.arch }}-*.deb" | wc -l | tr -d ' ')"
          test "${count}" -eq 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-debian-${{ matrix.arch }}
          path: dist/linux/${{ matrix.arch }}/*/final/*-debian-${{ matrix.arch }}-*.deb
          if-no-files-found: error

  # Arch Linux is not built here: the archlinux image has no arm64 variant and the Qt
  # action needs apt-get. See RECOVERY_BACKLOG.md [RELEASE-ARCH].
  publish:
    needs: [resolve, macos, windows, debian]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: release
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: release-assets
          merge-multiple: true
      - name: Validate and collect release files
        run: |
          set -euo pipefail
          require_count() {
            local pattern="$1"
            local expected="$2"
            local actual
            actual="$(find release-assets -type f -name "${pattern}" | wc -l | tr -d ' ')"
            if [[ "${actual}" -ne "${expected}" ]]; then
              echo "expected ${expected} ${pattern} assets, found ${actual}" >&2
              exit 1
            fi
          }
          require_count '*-macos-*.dmg' 2
          require_count '*-macos-*.zip' 2
          require_count '*-windows-*-installer.exe' 2
          require_count '*-windows-*.zip' 2
          require_count '*-debian-*.deb' 2

          mkdir -p staging
          find release-assets -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.deb' -o \
            -name '*-installer.exe' \) -exec cp {} staging/ \;
          test "$(find staging -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 10
          (cd staging && sha256sum -- * > SHA256SUMS)
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: SSA Consulta Rapida ${{ needs.resolve.outputs.version }}
          generate_release_notes: true
          files: staging/*
