name: codeql

on:
  push:
  pull_request:
  schedule:
    - cron: "20 7 * * 1"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  analyze:
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          cache: true
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libsqlite3-dev libgl1-mesa-dev
      - uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
      - name: Configure
        run: cmake --preset dev
      - name: Build
        run: cmake --build --preset dev
      - uses: github/codeql-action/analyze@v4
