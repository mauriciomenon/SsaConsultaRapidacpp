# SonarQube project configuration for SSA Consulta Rapida Cpp.
#
# IMPORTANT LIMITATION: SonarQube Community does NOT ship a C/C++ analyzer.
# The CFamily analyzer is a commercial plugin (SonarSource Developer Edition+).
# Without it, sonar-scanner only runs text/secrets analysis on .cpp/.h files -
# it does not compute bugs, code smells, coverage or duplication for C++.
#
# This config is kept for the day a SonarQube edition with CFamily is available
# (or for CI on a licensed server). For local C++ analysis use the existing
# clang-tidy + cppcheck toolchain instead (see docs/development/build-run-test.md).
#
# Run a scan (requires a running SonarQube server + a token):
#   container run -d --name sonarqube -p 9000:9000 -m 4G sonarqube:community
#   sonar-scanner \
#     -Dsonar.projectKey=ssa_consulta_rapida_cpp \
#     -Dsonar.token=squ_... \
#     -Dsonar.host.url=http://localhost:9000
#
# The token is generated in SonarQube UI: User > My Account > Security >
# Generate Tokens. Never commit a real token; pass it via -Dsonar.token or env.

sonar.projectKey=ssa_consulta_rapida_cpp
sonar.projectName=SSA Consulta Rapida Cpp
sonar.projectVersion=0.5.1

# Source directories (relative to project root).
sonar.sources=src,app
sonar.tests=tests

# Language.
sonar.language=c++

# Exclude generated/build files and vendored deps.
sonar.exclusions=**/build/**,**/_deps/**,**/build-dev/**,**/*.moc.*,**/mocs_*.cpp,**/qrc_*.cpp

# Coverage report (generated by scripts/generate-coverage.sh as lcov).
# Uncomment after running coverage to upload it:
# sonar.coverageReportPaths=build/dev-cov/coverage_html/coverage.info

# CFamily analyzer: use the compile_commands.json from the dev preset so the
# analyzer resolves includes correctly.
sonar.cfamily.compile-commands=build/dev/compile_commands.json
sonar.cfamily.cache.enabled=false

# Encoding.
sonar.sourceEncoding=UTF-8
