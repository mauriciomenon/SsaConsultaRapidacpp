stages:
  - verify
  - security

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'

default:
  interruptible: true

variables:
  GIT_DEPTH: "20"
  QT_QPA_PLATFORM: "offscreen"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  QT_ROOT: "$CI_PROJECT_DIR/.cache/Qt/6.11.0/gcc_64"

linux-verify:
  stage: verify
  image: python:3.13-bookworm
  cache:
    key: "qt-6.11.0-linux-x86_64"
    paths:
      - .cache/pip/
      - .cache/Qt/
  before_script:
    - apt-get update
    - >-
      apt-get install -y --no-install-recommends
      build-essential cmake ninja-build libsqlite3-dev sqlite3
      libgl1-mesa-dev libegl1 libopengl0 libxkbcommon-x11-0
      libxcb-cursor0 clang-format
    - python -m pip install --disable-pip-version-check "aqtinstall==3.3.0"
    - >-
      if [ ! -f "$QT_ROOT/lib/cmake/Qt6/Qt6Config.cmake" ]; then
        aqt install-qt linux desktop 6.11.0 linux_gcc_64
        --outputdir "$CI_PROJECT_DIR/.cache/Qt";
      fi
    - export PATH="$QT_ROOT/bin:$PATH"
    - export CMAKE_PREFIX_PATH="$QT_ROOT"
  script:
    - cmake --preset dev -DCMAKE_PREFIX_PATH="$QT_ROOT"
    - cmake --build --preset dev --parallel 2
    - ctest --preset dev --output-on-failure
    - cmake --build --preset dev --target all_qmllint
    - >-
      find src app tests tools -type f
      \( -name '*.cpp' -o -name '*.h' \) -print0
      | xargs -0 clang-format --dry-run --Werror

secret-scan:
  stage: security
  image:
    name: ghcr.io/gitleaks/gitleaks:v8.30.1
    entrypoint: [""]
  script:
    - gitleaks dir . --redact --exit-code 1 --no-banner
