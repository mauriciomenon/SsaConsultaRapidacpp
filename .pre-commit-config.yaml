# Pre-commit hooks for SSA Consulta Rapida Cpp.
# Install once: pre-commit install
# Run manually: pre-commit run --all-files
#
# POLICY: formatting, lint, and secret-scanning findings block a commit.
#
# Hooks that modify files (clang-format, cmake-format, qmlformat) still rewrite
# in place. Pre-commit detects the resulting diff and asks the user to review
# and stage it before the next commit attempt.

repos:
  - repo: local
    hooks:
      - id: clang-format
        name: clang-format (C++)
        description: Format C/C++ sources; formatting changes block the commit.
        entry: clang-format -i
        language: system
        files: \.(cpp|h|hpp|cc)$
        exclude: ^build/|^build-dev/|^_deps/

      - id: cmake-format
        name: cmake-format
        description: Format CMake files; formatting changes block the commit.
        entry: cmake-format -i
        language: system
        files: (CMakeLists\.txt|.*\.cmake)$
        exclude: ^build/

      - id: shellcheck
        name: shellcheck (scripts)
        description: Lint shell scripts; findings block the commit.
        entry: shellcheck --exclude=SC1091
        language: system
        files: ^scripts/.*\.sh$

      - id: qmlformat
        name: qmlformat
        description: Format QML files; formatting changes block the commit.
        entry: qmlformat -i
        language: system
        files: \.qml$
        exclude: ^build/

      - id: cppcheck
        name: cppcheck
        description: Static analysis for changed production C/C++; findings block.
        entry: bash -c 'cppcheck --enable=warning,style --inconclusive
          --error-exitcode=1
          --suppress=missingIncludeSystem --suppress=useStlAlgorithm
          --suppress=functionStatic --suppress=constParameterReference
          --suppress=constVariableReference "$@"' --
        language: system
        files: \.(cpp|h|hpp|cc)$
        exclude: ^build/|^build-dev/|^_deps/|^tests/
        pass_filenames: true
        stages: [manual]

      - id: qmllint
        name: qmllint
        description: Type-aware QML lint; blocks commits on findings.
        entry: bash -c 'test -f build/dev/build.ninja || { echo "build/dev is not configured; run cmake --preset dev" >&2; exit 1; }; cmake --build --preset dev --target all_qmllint' --
        language: system
        files: \.qml$
        exclude: ^build/
        pass_filenames: false

      - id: semgrep-qml
        name: semgrep QML policies
        description: Incremental QML policy checks; requires Semgrep 1.169.0 or newer.
        entry: semgrep scan --config .semgrep/qml.yml --error --metrics=off
        language: system
        files: \.qml$
        exclude: ^build/|^\.semgrep/
        pass_filenames: true

      - id: cmake-lint
        name: cmake-lint
        description: Lint CMake files; findings block.
        entry: cmake-lint
        language: system
        files: (CMakeLists\.txt|.*\.cmake)$
        exclude: ^build/
        stages: [manual]

      - id: gitleaks
        name: gitleaks (secrets)
        description: Staged secret scan; blocks commits on findings.
        entry: gitleaks git --staged --redact --no-banner --exit-code 1 .
        language: system
        pass_filenames: false

      - id: gitleaks-full
        name: gitleaks full history
        description: Full repository secret scan for manual verification.
        entry: gitleaks git --redact --no-banner --exit-code 1 .
        language: system
        pass_filenames: false
        stages: [manual]

      - id: detect-secrets
        name: detect-secrets
        description: Secret scanning; blocks commits on findings.
        entry: detect-secrets-hook --baseline .secrets.baseline
        language: system
        pass_filenames: true

      - id: trufflehog
        name: trufflehog staged files
        description: Verified staged-file scan; may call verifier APIs and block the commit.
        entry: bash -c 'for file in "$@"; do trufflehog filesystem "$file" --results=verified,unknown --fail --fail-on-scan-errors --no-update || exit; done' --
        language: system
        exclude: ^build/|^dist/|^\.semgrep/
        pass_filenames: true

      - id: trufflehog-history
        name: trufflehog Git history
        description: Full Git history secret scan for manual verification.
        entry: trufflehog git file://. --results=verified,unknown --fail --fail-on-scan-errors --no-update
        language: system
        pass_filenames: false
        stages: [manual]
