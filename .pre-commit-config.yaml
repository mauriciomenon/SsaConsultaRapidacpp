# Pre-commit hooks for SSA Consulta Rapida Cpp.
# Install once: pre-commit install
# Run manually: pre-commit run --all-files
#
# POLICY: formatting hooks are advisory. Secret scanning blocks a commit.
#
# Hooks that modify files (clang-format, cmake-format, qmlformat) still rewrite
# in place; pre-commit reports them as "Passed" because of the || true wrapper,
# and the changes end up unstaged for the user to review/amend.

repos:
  - repo: local
    hooks:
      - id: clang-format
        name: clang-format (C++) [advisory]
        description: Format C/C++ sources; advisory only, never blocks.
        entry: bash -c 'clang-format -i "$@" || true' --
        language: system
        files: \.(cpp|h|hpp|cc)$
        exclude: ^build/|^build-dev/|^_deps/

      - id: cmake-format
        name: cmake-format [advisory]
        description: Format CMake files; advisory only, never blocks.
        entry: bash -c 'cmake-format -i "$@" || true' --
        language: system
        files: (CMakeLists\.txt|.*\.cmake)$
        exclude: ^build/

      - id: shellcheck
        name: shellcheck (scripts) [advisory]
        description: Lint shell scripts; advisory only, never blocks.
        entry: bash -c 'shellcheck --exclude=SC1091 "$@" || true' --
        language: system
        files: ^scripts/.*\.sh$

      - id: qmlformat
        name: qmlformat [advisory]
        description: Format QML files; advisory only, never blocks.
        entry: bash -c 'qmlformat -i "$@" || true' --
        language: system
        files: \.qml$
        exclude: ^build/

      - id: cppcheck
        name: cppcheck [advisory]
        description: Static analysis for C/C++; advisory only, never blocks.
        entry: bash -c 'cppcheck --enable=warning,style --inconclusive
          --suppress=missingIncludeSystem --suppress=useStlAlgorithm
          --suppress=functionStatic --suppress=constParameterReference
          --suppress=constVariableReference "$@" || true' --
        language: system
        files: \.(cpp|h|hpp|cc)$
        exclude: ^build/|^build-dev/|^_deps/|^tests/
        pass_filenames: true
        stages: [manual]

      - id: qmllint
        name: qmllint
        description: Type-aware QML lint; blocks commits on findings.
        entry: bash -c 'test -f build/dev/build.ninja || { echo "build/dev is not configured; run cmake --preset dev" >&2; exit 1; }; cmake --build --preset dev --target all_qmllint' --
        language: system
        files: \.qml$
        exclude: ^build/
        pass_filenames: false

      - id: semgrep-qml
        name: semgrep QML policies
        description: Incremental QML policy checks; requires Semgrep 1.169.0 or newer.
        entry: semgrep scan --config .semgrep/qml.yml --error --metrics=off
        language: system
        files: \.qml$
        exclude: ^build/|^\.semgrep/
        pass_filenames: true

      - id: cmake-lint
        name: cmake-lint [advisory]
        description: Lint CMake files; advisory only, never blocks.
        entry: bash -c 'cmake-lint "$@" || true' --
        language: system
        files: (CMakeLists\.txt|.*\.cmake)$
        exclude: ^build/
        stages: [manual]

      - id: gitleaks
        name: gitleaks (secrets)
        description: Staged secret scan; blocks commits on findings.
        entry: gitleaks git --staged --redact --no-banner --exit-code 1 .
        language: system
        pass_filenames: false

      - id: gitleaks-full
        name: gitleaks full history
        description: Full repository secret scan for manual verification.
        entry: gitleaks git --redact --no-banner --exit-code 1 .
        language: system
        pass_filenames: false
        stages: [manual]

      - id: detect-secrets
        name: detect-secrets
        description: Secret scanning; blocks commits on findings.
        entry: detect-secrets-hook --baseline .secrets.baseline
        language: system
        pass_filenames: true

      - id: trufflehog
        name: trufflehog staged files
        description: Verified staged-file scan; may call verifier APIs and block the commit.
        entry: trufflehog filesystem --results=verified,unknown --fail --fail-on-scan-errors --no-update
        language: system
        exclude: ^build/|^dist/|^\.semgrep/
        pass_filenames: true
