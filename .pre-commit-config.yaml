# Pre-commit hooks for SSA Consulta Rapida Cpp.
# Install once: pre-commit install
# Run manually: pre-commit run --all-files
#
# POLICY: hooks are advisory only - they NEVER block a commit. Every hook is
# wrapped with `|| true` so its exit code is always 0 and the commit always
# succeeds. The intent is to nudge (print warnings), not to gate.
#
# Hooks that modify files (clang-format, cmake-format, qmlformat) still rewrite
# in place; pre-commit reports them as "Passed" because of the || true wrapper,
# and the changes end up unstaged for the user to review/amend.

repos:
  - repo: local
    hooks:
      - id: clang-format
        name: clang-format (C++) [advisory]
        description: Format C/C++ sources; advisory only, never blocks.
        entry: bash -c 'clang-format -i "$@" || true' --
        language: system
        files: \.(cpp|h|hpp|cc)$
        exclude: ^build/|^build-dev/|^_deps/

      - id: cmake-format
        name: cmake-format [advisory]
        description: Format CMake files; advisory only, never blocks.
        entry: bash -c 'cmake-format -i "$@" || true' --
        language: system
        files: (CMakeLists\.txt|.*\.cmake)$
        exclude: ^build/

      - id: shellcheck
        name: shellcheck (scripts) [advisory]
        description: Lint shell scripts; advisory only, never blocks.
        entry: bash -c 'shellcheck --exclude=SC1091 "$@" || true' --
        language: system
        files: ^scripts/.*\.sh$

      - id: qmlformat
        name: qmlformat [advisory]
        description: Format QML files; advisory only, never blocks.
        entry: bash -c 'qmlformat -i "$@" || true' --
        language: system
        files: \.qml$
        exclude: ^build/

      - id: cppcheck
        name: cppcheck [advisory]
        description: Static analysis for C/C++; advisory only, never blocks.
        entry: bash -c 'cppcheck --enable=warning,style --inconclusive
          --suppress=missingIncludeSystem --suppress=useStlAlgorithm
          --suppress=functionStatic --suppress=constParameterReference
          --suppress=constVariableReference "$@" || true' --
        language: system
        files: \.(cpp|h|hpp|cc)$
        exclude: ^build/|^build-dev/|^_deps/|^tests/
        pass_filenames: true
        stages: [manual]

      - id: qmllint
        name: qmllint [advisory]
        description: Lint QML files; advisory only, never blocks.
        entry: bash -c 'qmllint "$@" || true' --
        language: system
        files: \.qml$
        exclude: ^build/
        stages: [manual]

      - id: cmake-lint
        name: cmake-lint [advisory]
        description: Lint CMake files; advisory only, never blocks.
        entry: bash -c 'cmake-lint "$@" || true' --
        language: system
        files: (CMakeLists\.txt|.*\.cmake)$
        exclude: ^build/
        stages: [manual]

      - id: gitleaks
        name: gitleaks (secrets) [advisory]
        description: Secret scanning; advisory only, never blocks.
        entry: bash -c 'gitleaks dir . --redact --no-banner || true' --
        language: system
        pass_filenames: false

      - id: detect-secrets
        name: detect-secrets [advisory]
        description: Secret scanning; advisory only, never blocks.
        entry: bash -c 'detect-secrets scan --baseline .secrets.baseline 2>/dev/null || true' --
        language: system
        pass_filenames: false
        stages: [manual]
